[project]
name = "datasette-arrows"
version = "0.1a0"
description = "Streaming exports for Datasette using Arrow IPC."
readme = "README.md"
authors = [{name = "Datasette"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.11"
dependencies = [
    "datasette>=1.0a43",
    "pyarrow"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-arrows"
Changelog = "https://github.com/datasette/datasette-arrows/releases"
Issues = "https://github.com/datasette/datasette-arrows/issues"
CI = "https://github.com/datasette/datasette-arrows/actions"

[project.entry-points.datasette]
arrows = "datasette_arrows"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
